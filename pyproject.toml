[project]
name = "nexum-ai-secure-image-analyzer-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.5.0",
    "langchain-google-genai",
    "pydantic>=2.14.1",
    "fastapi>=0.156.4",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.3",
    "python-dotenv>=1.0.0"
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

